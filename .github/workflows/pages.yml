name: Deploy to GitHub Pages

# Publishes the site on every push to main.
# One-time setup: Settings -> Pages -> Build and deployment -> Source: GitHub Actions.
# Everything else, including the custom domain, is in docs/DEPLOY.md.

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Sanity-check the page
        run: |
          test -f index.html
          test -f assets/css/site.css
          test -f assets/js/site.js
          grep -q "aisopach" index.html
          echo "Site files present."

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
